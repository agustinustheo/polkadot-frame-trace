[package]
name = "polkadot-frame-trace"
description = "OpenTelemetry traces of what a Polkadot SDK block did to storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/agustinustheo/polkadot-frame-trace"
homepage = "https://agustinustheodorus.com/polkadot-frame-trace/"
readme = "README.md"
keywords = ["polkadot", "substrate", "opentelemetry", "tracing", "storage"]
categories = ["command-line-utilities", "development-tools::debugging", "development-tools::profiling", "cryptography::cryptocurrencies"]
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.7.5", features = ["derive", "std"] }
comfy-table = "8.0.1"
ctrlc = { version = "3.4", features = ["termination"] }
cumulus-primitives-proof-size-hostfunction = "=0.21.0"
frame-decode = { version = "0.18.1", default-features = false, features = ["std"] }
frame-metadata = { version = "23.0.1", default-features = false, features = ["current", "decode", "std"] }
hash-db = "0.16"
hex = "0.4.3"
httpdate = "1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
parking_lot = "0.12"
percent-encoding = "2.3"
prost = "0.14"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
sc-executor = "=0.51.0"
sc-executor-common = "=0.47.0"
scale-info = { version = "2.11.6", default-features = false, features = ["std", "decode"] }
scale-value = { version = "0.18.2", default-features = false }
schnellru = "0.2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sp-core = "=43.0.0"
sp-crypto-ec-utils = { version = "=0.24.0", features = ["rfc163"] }
sp-crypto-hashing = "0.1.0"
sp-externalities = "=0.34.0"
sp-io = "=49.0.0"
sp-maybe-compressed-blob = "=11.1.0"
sp-panic-handler = "13.0.2"
sp-runtime = "=49.0.0"
sp-state-machine = "=0.54.0"
sp-statement-store = "=29.0.0"
sp-trie = "=47.0.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-core = "0.1"
trie-db = "0.32"
zstd = "0.13.4"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
wat = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[profile.dev]
debug = 0
